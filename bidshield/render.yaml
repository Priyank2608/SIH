services:
  - type: web
    name: bidshield-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./bidshield/backend/Dockerfile
    dockerContext: ./bidshield/backend
    healthCheckPath: /health
    envVars:
      - key: BIDSHIELD_DATABASE_URL
        fromDatabase:
          name: bidshield-db
          property: connectionString
      - key: BIDSHIELD_JWT_SECRET
        generateValue: true
      - key: BIDSHIELD_INITIAL_USER_PASSWORD
        # This is an explicitly labelled public evaluation environment. It must
        # match the credentials documented on the login screen and in the README.
        value: BidShield@123
      - key: BIDSHIELD_RESET_DEMO_PASSWORDS
        # Repairs the existing first deployment, which was seeded with a
        # generated password, without deleting procurement demo data.
        value: "true"
      - key: BIDSHIELD_DEMO_MODE
        value: "false"
      - key: BIDSHIELD_STORAGE_DIR
        value: /tmp/bidshield
      - key: BIDSHIELD_CORS_ORIGINS
        value: https://bidshield-frontend.onrender.com
  - type: web
    name: bidshield-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: ./bidshield/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: bidshield-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: bidshield-db
    databaseName: bidshield
    user: bidshield
    postgresMajorVersion: "16"
    region: oregon
    plan: free
