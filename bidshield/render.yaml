services:
  - type: web
    name: bidshield-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: BIDSHIELD_DATABASE_URL
        fromDatabase:
          name: bidshield-db
          property: connectionString
      - key: BIDSHIELD_JWT_SECRET
        generateValue: true
      - key: BIDSHIELD_INITIAL_USER_PASSWORD
        sync: false
      - key: BIDSHIELD_DEMO_MODE
        value: "false"
      - key: BIDSHIELD_STORAGE_DIR
        value: /tmp/bidshield
      - key: BIDSHIELD_CORS_ORIGINS
        sync: false
  - type: web
    name: bidshield-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: bidshield-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: bidshield-db
    databaseName: bidshield
    user: bidshield
    postgresMajorVersion: "16"
    region: oregon
    plan: free